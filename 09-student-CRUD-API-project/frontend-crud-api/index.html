<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container" style="margin-top: 5px;"><br/>
        <h2 class="mb-4">Student Records</h2>        
        <div class="d-flex justify-content-between mb-3">
            <input type="text" id="searchInput" class="form-control w-50" placeholder="Search by name">
            <div>
                <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addStudentModal">Add
                    Student</button>
                <button class="btn btn-primary" onclick="fetchStudents()">Refresh</button>
                <button class="btn btn-danger" onclick="#">Logout</button>
            </div>
        </div>      

      <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Profile Picture</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>View</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">           
        </tbody>    
      </table>
    </div>

  <!-- Modal for viewStudent -->
  <div class="modal fade" id="viewStudentModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">Student Details</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="container">
                    <div class="row">
                        <div class="col-md-12">
                          <div class="form-group row">
                            <div class="col-md-9">
                                <img src="" id="viewProfilePic" width="80" height="80" class="rounded-circle" />
                            </div>
                          </div>
            
                          <div class="form-group row">
                            <label for="first_name" class="col-md-3 col-form-label fw-bold">Name:</label>
                            <div class="col-md-9">
                              <p class="form-control-plaintext text-muted"><span id="viewName"></span></p>
                            </div>
                          </div>
            
                          <div class="form-group row">
                            <label for="email" class="col-md-3 col-form-label fw-bold">Email:</label>
                            <div class="col-md-9">
                              <p class="form-control-plaintext text-muted"><span id="viewEmail"></span></p>
                            </div>
                          </div>
            
                          <div class="form-group row">
                            <label for="phone" class="col-md-3 col-form-label fw-bold">Phone:</label>
                            <div class="col-md-9">
                              <p class="form-control-plaintext text-muted"><span id="viewPhone"></span></p>
                            </div>
                          </div>
            
                          <div class="form-group row">
                            <label for="Gender" class="col-md-3 col-form-label fw-bold">Gender:</label>
                            <div class="col-md-9">
                              <p class="form-control-plaintext text-muted"><span id="viewGender"></span></p>
                            </div>
                          </div>
                        </div>
                      </div>
              </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <!-- EO Modal for viewStudent -->

  <!-- Modal for addStudent -->
  <div class="modal fade" id="addStudentModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="addStudentLabel">Add New Student</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="container">
                    <div class="row">
                        <form id="addStudentForm" enctype="multipart/form-data">          
                            <div class="card-body">
                              <div class="row">
                                <div class="col-md-12">
                                  <div class="form-group row">
                                    <label for="first_name" class="col-md-3 col-form-label fw-bold">First Name:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="first_name" id="first_name" placeholder= "First Name" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="last_name" class="col-md-3 col-form-label fw-bold">Last Name:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="last_name" id="last_name" placeholder="Last Name" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="email" class="col-md-3 col-form-label fw-bold">Email:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="email" id="email" placeholder="Email" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="phone" class="col-md-3 col-form-label fw-bold">Phone:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="phone" id="phone" placeholder="Phone" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="name" class="col-md-3 col-form-label fw-bold">Gender:</label>
                                    <div class="col-md-9 mb-2">
                                      <select class="form-select" name="gender" id="gender" required>
                                          <option value="">Select</option>
                                          <option value="Male">Male</option>
                                          <option value="Female">Female</option>
                                          <option value="Other">Other</option>
                                      </select>
                                    </div>
                                  </div>

                                  <div class="form-group row">
                                    <label for="profile_pic" class="col-md-3 col-form-label fw-bold">Upload Profile Pic:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="file" name="profile_pic" id="profile_pic" class="form-control" required>
                                    </div>
                                  </div>                                  
                                </div>
                              </div>
                            </div>                         
                      </div>
              </div>
              
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-success" type="submit">Create Student</button>
        </div>
    </form>
      </div>
    </div>
  </div>
  <!-- EO Modal for addStudent -->

  <!-- Modal for editStudent -->
  <div class="modal fade" id="editStudentModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editStudentLabel">Edit Student</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="container">
                    <div class="row">
                        <form id="editStudentForm" enctype="multipart/form-data"> 
                            <input type="hidden" name="editStudentId" id="editStudentId">       
                            <div class="card-body">
                              <div class="row">
                                <div class="col-md-12">
                                  <div class="form-group row">
                                    <label for="first_name" class="col-md-3 col-form-label fw-bold">First Name:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="first_name" id="editFirstName" placeholder= "First Name" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="last_name" class="col-md-3 col-form-label fw-bold">Last Name:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="last_name" id="editLastName" placeholder="Last Name" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="email" class="col-md-3 col-form-label fw-bold">Email:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="email" id="editEmail" placeholder="Email" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="phone" class="col-md-3 col-form-label fw-bold">Phone:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="text" name="phone" id="editPhone" placeholder="Phone" class="form-control" required>
                                    </div>
                                  </div>
            
                                  <div class="form-group row">
                                    <label for="name" class="col-md-3 col-form-label fw-bold">Gender:</label>
                                    <div class="col-md-9 mb-2">
                                      <select class="form-select" name="gender" id="editGender" required>
                                          <option value="">Select</option>
                                          <option value="Male">Male</option>
                                          <option value="Female">Female</option>
                                          <option value="Other">Other</option>
                                      </select>
                                    </div>
                                  </div>

                                  <div class="form-group row">
                                    <label for="your_profile_pic" class="col-md-3 col-form-label fw-bold">Profile Pic:</label>
                                    <div class="col-md-9 mb-2">
                                        <img src="" id="editProfilePic" width="80" height="80" class="rounded-circle" />

                                    </div>
                                  </div>

                                  <div class="form-group row">
                                    <label for="profile_pic" class="col-md-3 col-form-label fw-bold">Update Profile Pic:</label>
                                    <div class="col-md-9 mb-2">
                                      <input type="file" name="profile_pic" id="update_profile_pic" class="form-control" required>
                                      
                                    </div>
                                  </div>                                  
                                </div>
                              </div>
                            </div>                        
                      </div>
              </div>
              
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-success" type="submit">Update</button>
        </div>
    </form>
      </div>
    </div>
  </div>
  <!-- EO Modal for editStudent -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    const apiUrl = 'http://localhost:3000/api/students/'
    const imgUrl = 'http://localhost:3000/uploads/'
    //View All Students
    async function fetchStudents(search = ''){
    const res = await fetch(`${apiUrl}?search=${encodeURIComponent(search)}`)
    const data =  await res.json()
    // console.log(data)
    let srno = 1
    const tBody = document.querySelector('#studentTableBody')
    tBody.innerHTML = ''    
        data.forEach(student => {
            const profilePic = student.profile_pic ? imgUrl+student.profile_pic : 'https://placehold.net/avatar.png' 

            tBody.innerHTML += `
            <tr>
                    <td>${srno++}</td>
                    <td><img src="${profilePic}" width="50" height="50" class="rounded-circle"/></td>
                    <td>${student.first_name}</td>
                    <td>${student.last_name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>${student.gender}</td>
                    <td><button class="btn btn-success" onclick="viewStudent('${student._id}')">View</button></td>
                    <td><button class="btn btn-primary" onclick="editStudent('${student._id}')">Edit</button></td>
                    <td><button class="btn btn-danger"  onclick="deleteStudent('${student._id}')">Delete</button></td>
                </tr>
            `
        })
    }
    fetchStudents()

    // View Single Student Record
    const viewStudent = async (id) => {
        const apiUrl = 'http://localhost:3000/api/students'
        const imgUrl = 'http://localhost:3000/uploads/'

        const res = await fetch(`${apiUrl}/${id}`)
        const student = await res.json()
        // console.log(student)

        const profilePic = student.profile_pic ? imgUrl+student.profile_pic : 'https://placehold.net/avatar.png' 

        document.querySelector('#viewProfilePic').src = profilePic
        document.querySelector('#viewName').innerText = `${student.first_name} ${student.last_name}`
        document.querySelector('#viewEmail').innerText = student.email
        document.querySelector('#viewPhone').innerText = student.phone
        document.querySelector('#viewGender').innerText = student.gender

        new bootstrap.Modal(document.querySelector('#viewStudentModal')).show()        
    }
    
    //Search Student
    document.querySelector('#searchInput').addEventListener('input', () => {
        fetchStudents(document.querySelector('#searchInput').value)
    })

    //Add New Student
    // console.log(document.querySelector('#addStudentForm'))
    document.querySelector('#addStudentForm').addEventListener('submit', async (e) => { 
        e.preventDefault()
        const formData = new FormData(e.target)
        const res = await fetch(apiUrl, {
            method: 'POST',
            body: formData
        })

        if (res.ok) {
            e.target.reset()
            bootstrap.Modal.getInstance(document.querySelector('#addStudentModal')).hide()
            fetchStudents()
        } else {
            alert('Error Creating Student')
        }
    })

    //Updated Student - Populate the Edit Modal
    const editStudent = async (id) => {
        const res = await fetch(`${apiUrl}${id}`)
        const student = await res.json()
        // console.log(student)
        const profilePic = student.profile_pic ? imgUrl+student.profile_pic : 'https://placehold.net/avatar.png' 

        document.querySelector('#editStudentId').value = student._id
        document.querySelector('#editFirstName').value = student.first_name
        document.querySelector('#editLastName').value = student.last_name
        document.querySelector('#editEmail').value = student.email
        document.querySelector('#editPhone').value = student.phone
        document.querySelector('#editGender').value = student.gender
        document.querySelector('#editProfilePic').src = profilePic
        
        new bootstrap.Modal(document.querySelector('#editStudentModal')).show()
    }

    //Update Student - Submit the changes
    document.querySelector('#editStudentForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const id = document.querySelector('#editStudentId').value
        const formData = new FormData(e.target)
        const res = await fetch(`${apiUrl}${id}`, {
            method: 'PUT',
            body: formData            
        })

        if (res.ok) {
            document.querySelector('#update_profile_pic').value = ''
            bootstrap.Modal.getInstance(document.querySelector('#editStudentModal')).hide()
            fetchStudents()
        } else {
            alert('Error Updating Student')
        }
    })

    //Delete Student
    const deleteStudent = async (id) => {
        if (confirm("Are you sure you want to delete?")) {
            const res = await fetch(`${apiUrl}${id}`, {
                method: 'DELETE'
            })
        }
        fetchStudents()
    }

</script>
</body>
</html>
